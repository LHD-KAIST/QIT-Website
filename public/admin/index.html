<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>QIT Site — Content Editor</title>
    <style>
      /* Shortcut to the auto-fill "Add a paper" tool. Shown (top-right) only
         while the Publications collection is open. */
      .add-paper-btn {
        position: fixed;
        top: 52px;
        right: 24px;
        z-index: 99999;
        display: none;
        background: #145661;
        color: #fff;
        font: 600 13px/1 system-ui, -apple-system, sans-serif;
        padding: 11px 16px;
        border-radius: 6px;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .add-paper-btn:hover {
        background: #0e3d45;
      }

      /* Hide Sveltia's global "quick create" (+) button in the top-right app bar
         (left of the account avatar). It opened a menu to create an entry or
         upload assets from anywhere, which was redundant/confusing — members and
         papers are created from within their own sections (or the Add-a-paper
         tool). Sveltia labels this button aria-label="Create Entry or Assets". */
      button[aria-label='Create Entry or Assets'] {
        display: none !important;
      }

      /* Hide the "Group" control in the entry-list toolbar. Members are grouped
         by section by default (see config.yml view_groups), so the manual
         grouping chooser is redundant. Sveltia labels it aria-label="Grouping
         Options". */
      button[aria-label='Grouping Options'] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <a href="/admin/paper" id="addPaperBtn" class="add-paper-btn">+ Add a paper</a>

    <!-- Sveltia CMS: a form-based editor that commits to GitHub. Login is gated
         by GitHub OAuth + repo write access (see /admin/config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      // Only show the button on the Publications collection view.
      const _btn = document.getElementById('addPaperBtn');
      function _toggleAddPaper() {
        _btn.style.display = location.hash.includes('/collections/publications')
          ? 'inline-block'
          : 'none';
      }
      window.addEventListener('hashchange', _toggleAddPaper);
      _toggleAddPaper();
    </script>
  </body>
</html>
