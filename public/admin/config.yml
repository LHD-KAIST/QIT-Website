backend:
  name: github
  repo: LHD-KAIST/QIT-Website
  branch: main
  # OAuth login is handled by our own Netlify Functions (secrets stay in Netlify
  # env vars, never in this public repo).
  base_url: https://kaist-qit.netlify.app
  auth_endpoint: .netlify/functions/auth

# Uploaded member photos go here.
media_folder: public/images/people
public_folder: /images/people

collections:
  - name: members
    label: Members
    label_singular: Member
    folder: src/data/members
    extension: json
    format: json
    identifier_field: name
    slug: '{{fields.id}}'
    create: true
    summary: '{{fields.name}} — {{fields.roleLabel}}'
    fields:
      - name: id
        label: 'ID — lowercase, e.g. lee-hodong (do NOT change once set)'
        widget: string
      - { name: name, label: 'Name', widget: string }
      - name: role
        label: 'Role (which section)'
        widget: select
        options:
          - { label: 'Team Leader', value: pi }
          - { label: 'Postdoctoral Researcher', value: postdoc }
          - { label: 'Graduate Student', value: grad }
          - { label: 'Undergraduate Student', value: undergrad }
          - { label: 'Alumni', value: alumni }
      - { name: roleLabel, label: 'Role label (shown under the name)', widget: string }
      - { name: title, label: 'Title — optional (e.g. Assistant Professor)', widget: string, required: false }
      - { name: affiliation, label: 'Affiliation', widget: string }
      - { name: order, label: 'Order within section (0 = first)', widget: number, value_type: int, default: 0, required: false }
      - { name: photo, label: 'Photo', widget: image, required: false, choose_url: false }
      - name: emails
        label: 'Emails'
        widget: list
        required: false
        summary: '{{fields.user}}@{{fields.domain}}'
        fields:
          - { name: user, label: 'user (before @)', widget: string }
          - { name: domain, label: 'domain (after @)', widget: string, default: kaist.ac.kr }
          - { name: primary, label: 'Primary', widget: boolean, default: true }
      - name: education
        label: 'Academic Career'
        widget: list
        required: false
        summary: '{{fields.position}}'
        fields:
          - { name: position, label: 'Position / Degree', widget: string }
          - { name: period, label: 'Period — optional (e.g. 2024 – present)', widget: string, required: false }
          - { name: org, label: 'Organization — optional', widget: string, required: false }
      - name: interests
        label: 'Research Interests'
        widget: list
        required: false
        field: { name: interest, label: 'Interest', widget: string }
      - name: links
        label: 'Links'
        widget: object
        required: false
        collapsed: false
        fields:
          - { name: scholar, label: 'Google Scholar URL', widget: string, required: false }
          - { name: website, label: 'Personal Homepage URL (adds the button under the photo)', widget: string, required: false }
          - { name: arxiv, label: 'arXiv URL', widget: string, required: false }
          - { name: orcid, label: 'ORCID URL', widget: string, required: false }
      - { name: nextPosition, label: 'Next position — for Alumni (e.g. PhD student, U. of Waterloo)', widget: string, required: false }
      - { name: authorKey, label: 'Author key — advanced (e.g. C. Oh)', widget: string, required: false }
      - { name: bio, label: 'Bio — not shown on the site currently', widget: text, required: false }

  - name: publications
    label: Publications
    label_singular: Paper
    folder: src/data/publications
    extension: json
    format: json
    identifier_field: title
    slug: '{{fields.id}}'
    create: true
    summary: '{{fields.year}} · {{fields.title}}'
    hint: 'To ADD a paper faster, use the "Add a paper" tool at /admin/paper (paste a DOI/arXiv link). Use this list to edit or fix existing papers.'
    fields:
      - { name: id, label: 'File id (do NOT change once set)', widget: string }
      - { name: title, label: 'Title', widget: string }
      - name: authors
        label: 'Authors (in order)'
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: 'Name (e.g. C. Oh)', widget: string }
          - { name: group, label: 'Lab member (bold)', widget: boolean, default: false, required: false }
          - { name: corresponding, label: 'Corresponding author (∗)', widget: boolean, default: false, required: false }
          - { name: memberId, label: 'Member id (if lab member, e.g. oh-changhun)', widget: string, required: false }
      - { name: year, label: 'Year', widget: number, value_type: int }
      - { name: order, label: 'Order within the year (0 = first)', widget: number, value_type: int, default: 0, required: false }
      - name: type
        label: 'Type'
        widget: select
        options:
          - { label: 'Journal', value: journal }
          - { label: 'Preprint', value: preprint }
      - { name: venue, label: 'Venue (short journal name / arXiv)', widget: string }
      - { name: citation, label: 'Citation', widget: string }
      - { name: url, label: 'URL', widget: string }
      - { name: arxiv, label: 'arXiv id — optional', widget: string, required: false }
      - name: tags
        label: 'Tags (keyword ids, at least 1)'
        widget: list
        field: { name: tag, label: 'Tag id', widget: string }
      - { name: highlight, label: 'Feature on the home page', widget: boolean, default: false }
      - { name: note, label: 'Note — optional (e.g. Editors'' Suggestion)', widget: string, required: false }
