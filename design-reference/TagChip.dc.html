<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ unsel }}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{ onClick }}" style="display:inline-flex;align-items:center;gap:8px;font-family:Archivo,sans-serif;font-size:12.5px;line-height:1;padding:7px 10px 7px 10px;border:1px solid #C9D3D5;border-radius:2px;background:#F8FAFA;color:#2C3639;cursor:pointer;letter-spacing:.005em" style-hover="border-color:#145661;color:#0E3D45;background:#EAF1F2" style-focus="outline:2px solid #145661;outline-offset:2px">
    <sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;background:#145661;display:block"></span></sc-if>
    <span>{{ label }}</span>
    <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7A888C">{{ count }}</span></sc-if>
  </button>
</sc-if>
<sc-if value="{{ sel }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ onClick }}" style="display:inline-flex;align-items:center;gap:8px;font-family:Archivo,sans-serif;font-size:12.5px;line-height:1;padding:7px 10px;border:1px solid #145661;border-radius:2px;background:#145661;color:#EAF1F2;cursor:pointer;letter-spacing:.005em" style-focus="outline:2px solid #C2571F;outline-offset:2px">
    <sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;background:#C2571F;display:block"></span></sc-if>
    <span>{{ label }}</span>
    <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9FC5CB">{{ count }}</span></sc-if>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#C2571F;margin-left:1px">×</span>
  </button>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Boson Sampling&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;hasCount&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isArea&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;unsel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
